name: Build OpenWrt 6.18 for Radxa A7Z/A7A

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-a7z-6.18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device:
          - radxa_cubie-a7z
          - radxa_cubie-a7a

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenWrt submodules
        run: git submodule update --init openwrt-sunxi-aiot Temp/openwrt-25.12

      - name: Check kernel 6.18 support
        run: |
          test -f openwrt-sunxi-aiot/include/kernel-6.18 || {
            echo "::error::openwrt-sunxi-aiot/include/kernel-6.18 is missing"
            exit 1
          }
          test -d openwrt-sunxi-aiot/target/linux/generic/pending-6.18 || {
            echo "::error::target/linux/generic/pending-6.18 is missing"
            exit 1
          }

      - name: Select kernel 6.18
        run: |
          grep -q '^KERNEL_PATCHVER:=6\.6$' openwrt-sunxi-aiot/target/linux/allwinner/Makefile

      - name: Check host build tools
        run: |
          set -eu
          for tool in make gcc g++ clang flex bison gawk git python3 rsync unzip file wget; do
            command -v "$tool" >/dev/null || { echo "Missing required tool: $tool"; exit 1; }
          done
          make --version | head -1
          gcc --version | head -1

      - name: Check disk space
        run: df -h

      - name: Setup OpenWrt build environment
        working-directory: ./openwrt-sunxi-aiot
        run: |
          git config --global http.connectTimeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          timeout --signal=TERM 20m env GIT_TERMINAL_PROMPT=0 ./scripts/feeds update -a
          timeout --signal=TERM 10m env GIT_TERMINAL_PROMPT=0 ./scripts/feeds install -a

      - name: Use kernel-6.18 mac80211 backports
        run: |
          src="$GITHUB_WORKSPACE/Temp/openwrt-25.12/package/kernel/mac80211"
          dst="$GITHUB_WORKSPACE/openwrt-sunxi-aiot/package/kernel/mac80211"
          test "$src" = "$(realpath "$src")"
          test "$dst" = "$(realpath "$dst")"
          test -f "$src/Makefile"
          test -f "$dst/Makefile"
          rm -rf -- "$dst"
          cp -a "$src" "${dst%/*}/"
          grep -q '^PKG_VERSION:=6\.18\.' openwrt-sunxi-aiot/package/kernel/mac80211/Makefile
          grep -q 'netns_immutable' openwrt-sunxi-aiot/package/kernel/mac80211/patches/build/210-wireless_netns_local_backport.patch
          install -m 0644 porting/openwrt-25.12/0005-mac80211-sockwq-6.18.patch \
            "$dst/patches/build/245-sockwq-native-6.18.patch"

      - name: Generate build configuration
        working-directory: ./openwrt-sunxi-aiot
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_allwinner=y
          CONFIG_TARGET_allwinner_aiot=y
          CONFIG_TARGET_allwinner_aiot_DEVICE_${{ matrix.device }}=y
          CONFIG_TARGET_BOARD="allwinner"
          CONFIG_TARGET_SUBTARGET="aiot"
          CONFIG_HAS_SUBTARGETS=y
          CONFIG_HAS_DEVICES=y
          CONFIG_DEFAULT_TARGET_OPTIMIZATION="-Os -pipe -mcpu=cortex-a53"
          CONFIG_CPU_TYPE="cortex-a53"
          CONFIG_KERNEL_PCI=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-commands=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_openssh-server=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_openssh-client=y

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_kmod-nvme=y
          CONFIG_PACKAGE_nvme-cli=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_usbutils=y

          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_kmod-mac80211=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_gzip=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_bash=y

          CONFIG_SIGNATURE_CHECK=n
          CONFIG_SIGNED_PACKAGES=n
          EOF
          make KERNEL_PATCHVER=6.18 defconfig
          grep -q '^CONFIG_TARGET_allwinner_aiot_DEVICE_${{ matrix.device }}=y$' .config
          for pkg in luci block-mount kmod-nvme wpad-openssl kmod-fs-ext4 tcpdump ethtool ip-full iw; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config || { echo "::error::package ${pkg} was not selected"; exit 1; }
          done

      - name: Build firmware with Linux 6.18
        working-directory: ./openwrt-sunxi-aiot
        run: |
          set -o pipefail
          if ! make KERNEL_PATCHVER=6.18 -j"$(nproc)" V=s > build.log 2>&1; then
            echo "::error::OpenWrt build failed; summarized compiler errors follow"
            { grep -Ei 'error:|fatal error:|undefined reference|No rule to make target|patch failed|Applying .* failed|make(\[[0-9]+\])?: \*\*\*' build.log || true; } | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -300 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Check build artifacts
        working-directory: ./openwrt-sunxi-aiot
        run: |
          ls -lh bin/targets/allwinner/aiot/ || echo "No artifacts found"
          file bin/targets/allwinner/aiot/* || echo "No files to check"

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-6.18-${{ matrix.device }}
          path: openwrt-sunxi-aiot/bin/targets/allwinner/aiot/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-6.18-${{ matrix.device }}
          path: openwrt-sunxi-aiot/build.log
          retention-days: 7
          if-no-files-found: warn
