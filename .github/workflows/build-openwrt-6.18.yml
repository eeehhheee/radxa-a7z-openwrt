name: Build OpenWrt 6.18 for Radxa A7Z

# Manual only: the 6.18 kernel port is not complete in openwrt-sunxi-aiot.
# The branch still ships include/kernel-6.6 only and has no
# target/linux/generic/{pending,backport,hack}-6.18. See ci/wip/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenWrt submodule
        run: git submodule update --init openwrt-sunxi-aiot

      - name: Check kernel 6.18 support
        run: |
          if [ ! -f openwrt-sunxi-aiot/include/kernel-6.18 ]; then
            echo "::error::Kernel 6.18 support is missing: openwrt-sunxi-aiot/include/kernel-6.18 and target/linux/generic/*-6.18 do not exist. Port them from an OpenWrt tree that ships 6.18 before running this workflow. See ci/wip/README.md."
            exit 1
          fi
          if ! ls openwrt-sunxi-aiot/target/linux/generic/pending-6.18 >/dev/null 2>&1; then
            echo "::error::Generic 6.18 kernel patches are missing (target/linux/generic/pending-6.18)."
            exit 1
          fi

      - name: Apply 6.18 overlay
        run: |
          cp -a ci/overlay-6.18/. openwrt-sunxi-aiot/
          git -C openwrt-sunxi-aiot apply "$GITHUB_WORKSPACE/ci/patches/dts-skip-uboot-pcie-training.patch"
          sed -i 's/^KERNEL_PATCHVER:=6\.6$/KERNEL_PATCHVER:=6.18/' openwrt-sunxi-aiot/target/linux/allwinner/Makefile
          grep -q '^KERNEL_PATCHVER:=6\.18$' openwrt-sunxi-aiot/target/linux/allwinner/Makefile

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libelf-dev libncurses-dev libssl-dev python3 python3-dev python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Setup OpenWrt build environment
        working-directory: ./openwrt-sunxi-aiot
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate build configuration
        working-directory: ./openwrt-sunxi-aiot
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_allwinner=y
          CONFIG_TARGET_allwinner_aiot=y
          CONFIG_TARGET_allwinner_aiot_DEVICE_radxa_cubie-a7z=y
          CONFIG_TARGET_BOARD="allwinner"
          CONFIG_TARGET_SUBTARGET="aiot"
          CONFIG_HAS_SUBTARGETS=y
          CONFIG_HAS_DEVICES=y
          CONFIG_DEFAULT_TARGET_OPTIMIZATION="-Os -pipe -mcpu=cortex-a53"
          CONFIG_CPU_TYPE="cortex-a53"
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_openssh-client=y
          CONFIG_SIGNATURE_CHECK=n
          CONFIG_SIGNED_PACKAGES=n
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_allwinner_aiot_DEVICE_radxa_cubie-a7z=y$' .config

      - name: Build firmware with Linux 6.18
        working-directory: ./openwrt-sunxi-aiot
        run: make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Check build artifacts
        working-directory: ./openwrt-sunxi-aiot
        run: |
          ls -lh bin/targets/allwinner/aiot/ || echo "No artifacts found"
          file bin/targets/allwinner/aiot/* || echo "No files to check"

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-a7z-6.18
          path: openwrt-sunxi-aiot/bin/targets/allwinner/aiot/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-6.18
          path: openwrt-sunxi-aiot/build.log
          retention-days: 7
          if-no-files-found: warn
